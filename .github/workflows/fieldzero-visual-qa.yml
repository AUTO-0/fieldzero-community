name: FIELDZERO desktop and mobile visual QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'staff.html'
      - 'inventory.html'
      - 'staff.js'
      - 'inventory.js'
      - 'staff.css'
      - 'social-preview.png'
      - 'scripts/fieldzero-staff-smoke.mjs'
      - 'styles.css'
      - 'franchise.css'
      - 'experience-2026.css'
      - 'app.js'
      - 'admin.html'
      - 'admin.js'
      - 'admin-workspace.js'
      - 'launch-console.css'
      - 'scripts/fieldzero-visual-qa.mjs'
      - '.github/workflows/fieldzero-visual-qa.yml'
jobs:
  visual-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax-check customer and admin scripts
        run: |
          node --check staff.js
          node --check inventory.js
          node --check scripts/fieldzero-staff-smoke.mjs
          node --check app.js
          node --check admin.js
          node --check scripts/fieldzero-visual-qa.mjs
      - name: Serve the website locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/fz-static.log 2>&1 &
          sleep 2
      - name: Test staff and inventory access, responsive layout and preview image
        run: node scripts/fieldzero-staff-smoke.mjs
      - name: Test responsive layouts and booking UI
        run: node scripts/fieldzero-visual-qa.mjs
      - name: Save desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldzero-responsive-qa
          path: visual-qa-artifacts/
          retention-days: 14
